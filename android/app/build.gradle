plugins {
    id 'com.android.application'
}

def websiteUrl = providers.gradleProperty('rightsDeskWebsiteUrl').orElse('').get()
if (websiteUrl) {
    def url = new URI(websiteUrl)
    if (url.scheme != 'https' || !url.host || url.userInfo) {
        throw new GradleException('rightsDeskWebsiteUrl must be an HTTPS URL without user info.')
    }
}

android {
    namespace 'org.rightsdesk.mobile'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'org.rightsdesk.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'RIGHTS_DESK_WEBSITE_URL', groovy.json.JsonOutput.toJson(websiteUrl)

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.assets.srcDir rootProject.file('../public')
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
